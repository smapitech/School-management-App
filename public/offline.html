<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#184d3b">
  <title>Offline | School Portal</title>
  <style>
    :root {
      color-scheme: light;
      --green: #184d3b;
      --green-2: #287a6a;
      --bg: #f4f6f3;
      --card: #ffffff;
      --ink: #1e2b27;
      --muted: #66726e;
      --line: #dfe6e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(40, 122, 106, 0.08), transparent 30%),
        var(--bg);
    }
    main {
      width: min(640px, 100%);
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(30, 43, 39, 0.08);
    }
    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 12px;
      color: #fff;
      background: var(--green);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      color: #fff;
      text-decoration: none;
      background: var(--green);
      border-radius: 12px;
      font-weight: 700;
    }
    a.secondary {
      color: var(--green);
      background: #eef5f1;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Offline</span>
    <h1>You are offline.</h1>
    <p>The school portal needs an internet connection to load the latest data. Please reconnect and refresh the page.</p>
    <div class="actions">
      <a href="/" onclick="location.reload(); return false;">Retry</a>
      <a class="secondary" href="/login">Go to Login</a>
    </div>
  </main>
</body>
</html>
